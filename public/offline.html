    <title>离线 · Offline — RinLit</title>
    <link rel="icon" href="/favicon/light.ico" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon/dark.ico" media="(prefers-color-scheme: dark)" />

    <!--
      Standalone offline fallback for the service worker.
      Inline styles keep this page fully available without network access.
      Follows the main site's rounded pills and purple palette, with flat fills
      instead of shadows, highlights or glass blur.
    -->
    <style>
      :root {
        --bg: #fbf9ff;
        --surface: #ffffff;
        --text: #2b2a33;
        --text-strong: #1d1c22;
        --text-muted: #6b687d;
        --text-faint: #938fa5;
        --border: rgba(29, 28, 34, 0.1);
        --border-strong: rgba(29, 28, 34, 0.16);
        --primary: #8c7ecd;
        --primary-strong: #695cb0;
        --primary-soft: #ede9fc;
        --warn: #c96854;
        --ok: #3f8d69;
        --pill-bg: #ffffff;
        --pill-hover: #f1eef9;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101216;
          --surface: #191b22;
          --text: #e7e6f0;
          --text-strong: #ffffff;
          --text-muted: #a39fbf;
          --text-faint: #77738e;
          --border: rgba(255, 255, 255, 0.09);
          --border-strong: rgba(255, 255, 255, 0.16);
          --primary: #ac9fe1;
          --primary-strong: #9182d0;
          --primary-soft: #25213e;
          --warn: #ef9b84;
          --ok: #7ac6a0;
          --pill-bg: #1d1f27;
          --pill-hover: #292b35;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        min-height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Sarasa SC', Geist, ui-sans-serif, system-ui, sans-serif;
        font-weight: 700;
        text-rendering: geometricPrecision;
        -webkit-font-smoothing: antialiased;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      button {
        font: inherit;
      }

      a {
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }

      .page {
        width: min(100%, 1280px);
        min-height: 100vh;
        min-height: 100svh;
        margin: 0 auto;
        padding:
          max(24px, env(safe-area-inset-top))
          clamp(20px, 4.5vw, 56px)
          max(22px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 46px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--pill-bg);
        text-decoration: none;
      }

      .brand__icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        overflow: hidden;
      }

      .brand__logo {
        display: block;
        width: 34px;
        height: 34px;
        object-fit: contain;
      }

      .brand__logo--dark {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .brand__logo--light {
          display: none;
        }

        .brand__logo--dark {
          display: block;
        }
      }

      .main {
        flex: 1;
        display: grid;
        place-items: center;
      }

      .copy {
        width: min(100%, 620px);
        padding: clamp(48px, 10vh, 96px) 0;
      }

      h1 {
        margin: 0;
        color: var(--text-strong);
        font-family: 'Plus Jakarta Sans', 'Sarasa SC', sans-serif;
        font-size: clamp(2.5rem, 6vw, 4.25rem);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .title-line {
        display: block;
      }

      .title-line--accent {
        color: var(--primary);
      }

      .description {
        margin: 20px 0 0;
        color: var(--text-muted);
        font-size: clamp(0.9rem, 1.4vw, 1rem);
        font-weight: 600;
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 28px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 146px;
        height: 46px;
        padding: 0 20px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--text-strong);
        font-size: 0.82rem;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 120ms ease, border-color 120ms ease;
      }

      .button svg {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .button:hover {
        border-color: var(--primary);
        background: var(--pill-hover);
      }

      .button:active {
        background: var(--primary-soft);
      }

      .button--primary {
        border-color: var(--primary);
        background: var(--primary);
        color: #ffffff;
      }

      .button--primary:hover {
        border-color: var(--primary-strong);
        background: var(--primary-strong);
        color: #ffffff;
      }

      .button--primary:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .button--primary.is-loading svg {
        animation: spin 0.8s linear infinite;
      }

      .connection-note {
        min-height: 20px;
        margin: 14px 0 0;
        color: var(--text-faint);
        font-size: 0.74rem;
        font-weight: 600;
        line-height: 1.5;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 560px) {
        .page {
          padding-inline: 18px;
        }

        .copy {
          padding: 40px 0 32px;
        }

        h1 {
          font-size: clamp(2.4rem, 12vw, 3.2rem);
          letter-spacing: -0.055em;
        }

        .description {
          margin-top: 16px;
          font-size: 0.88rem;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr;
          width: 100%;
          margin-top: 24px;
        }

        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

      <main class="main">
        <section class="copy" aria-labelledby="offline-title">
          <h1 id="offline-title">
            <span class="title-line" data-i18n="titleFirst">网络暂时</span>
            <span class="title-line title-line--accent" data-i18n="titleSecond">断开了。</span>
          </h1>

          <p class="description" data-i18n="description">
            检查 Wi-Fi 或移动网络后重试，也可以先返回首页。
          </p>

          <div class="actions">
            <button class="button button--primary" id="retry" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.34 5.66" />
                <path d="M20 4v7h-7" />
              </svg>
              <span data-i18n="retry">重新连接</span>
            </button>
            <a class="button" id="home-link" href="/zh-cn">
              <span data-i18n="home">返回首页</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 17 17 7" />
                <path d="M8 7h9v9" />
              </svg>
            </a>
          </div>

          <p class="connection-note" id="status-text" role="status" aria-live="polite"></p>
        </section>
      </main>
    </div>

    <script>
      (function () {
        var copy = {
          zh: {
            title: '离线 · Offline — RinLit',
            titleFirst: '网络暂时',
            titleSecond: '断开了。',
            description: '检查 Wi-Fi 或移动网络后重试，也可以先返回首页。',
            retry: '重新连接',
            retrying: '正在重新连接…',
            home: '返回首页',
            offline: '离线',
            online: '网络可用',
            stillOffline: '仍然处于离线状态',
            ready: '网络已恢复',
          },
          en: {
            title: 'Offline — RinLit',
            titleFirst: 'You are',
            titleSecond: 'offline.',
            description: 'Check your Wi-Fi or mobile network and try again, or head back home.',
            retry: 'Reconnect',
            retrying: 'Reconnecting…',
            home: 'Back home',
            offline: 'Offline',
            online: 'Online',
            stillOffline: 'Still offline',
            ready: 'Back online',
          },
        };

        var target = 'zh-cn';
        try {
          var saved = localStorage.getItem('rinlit:lang');
          var nav = navigator.language || '';
          target =
            saved === 'en' || saved === 'zh-cn'
              ? saved
              : /^zh/i.test(nav)
                ? 'zh-cn'
                : 'en';
        } catch (error) {
          /* keep the default */
        }

        var language = target === 'en' ? 'en' : 'zh';
        var strings = copy[language];
        var retry = document.getElementById('retry');
        var retryLabel = retry.querySelector('[data-i18n]');
        var homeLink = document.getElementById('home-link');
        var brandHome = document.getElementById('brand-home');
        var statusText = document.getElementById('status-text');

        document.documentElement.lang = target === 'en' ? 'en' : 'zh-CN';
        document.body.setAttribute('data-lang', language);
        document.title = strings.title;
        homeLink.href = '/' + target;
        brandHome.href = '/' + target;

        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (node) {
          var key = node.getAttribute('data-i18n');
          if (strings[key]) node.textContent = strings[key];
        });

        function renderConnection(online) {
          document.body.setAttribute('data-connection', online ? 'online' : 'offline');
          statusText.textContent = online ? strings.ready : '';
        }

        // This page is served after a navigation fetch fails. navigator.onLine
        // can still report true on captive portals or unstable Wi-Fi.
        renderConnection(false);

        retry.addEventListener('click', function () {
          retry.disabled = true;
          retry.classList.add('is-loading');
          retryLabel.textContent = strings.retrying;
          window.setTimeout(function () {
            window.location.reload();
          }, 350);
        });

        window.addEventListener('online', function () {
          renderConnection(true);
        });

        window.addEventListener('offline', function () {
          renderConnection(false);
          statusText.textContent = strings.stillOffline;
        });
      })();
    </script>
